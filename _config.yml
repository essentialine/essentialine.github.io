#remote_theme: pages-themes/hacker@v0.2.0
remote_theme: "mmistakes/so-simple-theme@3.2.0"
title: essentialine
author: Neal C
description: Drawing, tracing, seeing
page_excerpts: true
search_full_content: true
category_archive_path: "/categories/#"
tag_archive_path: "/tags/#"
read_time: true
words_per_minute: 200
url: https://essentialine.art
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-remote-theme
sass:
  style: compressed

# A list here replaces Jekyll 3's defaults, so they are repeated first.
# Then the local agent context (gitignored, private): never build or serve it.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - CLAUDE.md
  - AGENTS.md
  - POSTS.md
  - INFLUENCES.md
  - "*,v"
  - _drafts/AGENTS.md
